<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="title">Depth. Agreement. Surface.</title>
  <desc id="desc">Depth maps estimate distances to roof and ground. Fusion keeps points with at least three agreeing views. Reconstruction finds the boundary between free and solid space. Historical Delft counts are shown, not current defaults.</desc>
  <defs><pattern id="points" width="21" height="19" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="3" fill="#171717"/></pattern></defs>
  <rect width="960" height="430" fill="#f5f5f5"/><rect width="960" height="80" fill="#090909"/><rect width="7" height="80" fill="#ffd500"/>
  <text x="28" y="36" fill="white" font-size="26" font-weight="700">Depth. Agreement. Surface.</text>
  <text x="28" y="63" fill="#bdbdbd" font-size="16">OpenMVS / Three stages / Historical Delft example</text>
  <g fill="white"><rect x="20" y="99" width="293" height="235"/><rect x="333" y="99" width="293" height="235"/><rect x="646" y="99" width="293" height="235"/></g>
  <g fill="#171717">
    <rect x="151" y="120" width="29" height="18" rx="3"/><path d="M158 138H173L169 147H163Z"/>
    <path d="M42 305H119V231H203V305H287" fill="none" stroke="#171717" stroke-width="3"/>
    <g stroke="#626262" stroke-width="2"><path d="M166 147L62 305M166 147L97 305M166 147L241 305M166 147L270 305"/></g>
    <path d="M166 147L138 231M166 147L182 231" stroke="#b39700" stroke-width="3"/>
    <rect x="119" y="231" width="84" height="7" fill="#ffd500"/>
    <text x="161" y="263" font-size="15" text-anchor="middle">near / roof</text>
    <path d="M361 299H429V207H522V299H596" fill="none" stroke="#dedede" stroke-width="8"/>
    <path d="M361 292H436V200H515V292H596V308H506V215H445V308H361Z" fill="url(#points)"/>
    <g stroke="#626262" stroke-width="2"><path d="M370 228L380 238M380 228L370 238M476 160L486 170M486 160L476 170M554 233L564 243M564 233L554 243"/></g>
    <text x="351" y="130" font-size="15">Dots / ≥ 3 views agree</text>
    <text x="351" y="155" font-size="15" fill="#626262">Crosses / rejected</text>
    <path d="M671 297H745V202H830V297H916V319H671Z" fill="#626262"/>
    <path d="M671 297H745V202H830V297H916" fill="none" stroke="#171717" stroke-width="3"/>
