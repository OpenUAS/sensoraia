<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="title">Capture beyond the map.</title>
  <desc id="desc">The historical forty-photo Delft grid is five columns by eight rows. Three overlapping photo footprints surround the central two-tile output. Coverage outside the requested map gives stereo views at its edges. North is up.</desc>
  <defs><pattern id="cameras" width="98.5" height="57.4" patternUnits="userSpaceOnUse" x="74" y="99"><circle cx="49.25" cy="28.7" r="4.5" fill="#171717"/></pattern></defs>
  <rect width="960" height="640" fill="#f5f5f5"/>
  <rect width="960" height="80" fill="#090909"/><rect width="7" height="80" fill="#ffd500"/>
  <text x="28" y="36" fill="white" font-size="26" font-weight="700">Capture beyond the map.</text>
  <text x="28" y="62" fill="#bdbdbd" font-size="16">Historical 40-photo Delft example / North up / Approximately to scale</text>
  <rect x="74" y="99" width="492.5" height="459.2" fill="white" stroke="#626262" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="84" y="221" width="276" height="157" fill="#dedede" fill-opacity=".5" stroke="#626262" stroke-width="2"/>
  <rect x="182" y="221" width="276" height="157" fill="#dedede" fill-opacity=".5" stroke="#626262" stroke-width="2"/>
  <rect x="182" y="279" width="276" height="157" fill="none" stroke="#171717" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="236" y="264" width="168" height="132" fill="#ffd500" stroke="#171717" stroke-width="2"/>
  <path d="M320 264V396" stroke="#171717" stroke-width="2"/>
  <g font-size="16" font-weight="700" fill="#171717"><text x="278" y="335" text-anchor="middle">tile 1</text><text x="362" y="335" text-anchor="middle">tile 2</text></g>
  <rect x="74" y="99" width="492.5" height="459.2" fill="url(#cameras)"/>
  <text x="320" y="590" text-anchor="middle" font-size="17" fill="#171717">410 m × 382 m / 5 × 8 = 40 camera positions</text>
  <path d="M530 186V130M522 140L530 128L538 140" fill="none" stroke="#171717" stroke-width="2"/><text x="530" y="119" text-anchor="middle" font-size="15" font-weight="700">N</text>
  <g font-size="16" fill="#171717">
    <circle cx="622" cy="120" r="5"/><text x="642" y="126">Camera / 120.235 m AMSL</text>
    <rect x="614" y="151" width="17" height="13" fill="#dedede" stroke="#626262"/><text x="642" y="163">Photo / ≈ 230 m × 131 m</text>
    <rect x="614" y="188" width="17" height="13" fill="none" stroke="#171717" stroke-dasharray="3 2"/><text x="642" y="200">Neighbour in the next row</text>
    <rect x="614" y="225" width="17" height="13" fill="#ffd500" stroke="#171717"/><text x="642" y="237">Map / 140 m × 110 m</text>
    <path d="M614 270H633" stroke="#626262" stroke-width="2" stroke-dasharray="5 3"/><text x="642" y="276">Expanded capture box</text>
    <rect x="606" y="321" width="326" height="241" fill="white"/>
    <rect x="606" y="321" width="326" height="5" fill="#ffd500"/>
    <text x="626" y="364" font-size="23" font-weight="700">More views. Better edges.</text>
    <text x="626" y="402">≈ 64% overlap in this example.</text>
    <text x="626" y="432">At least 3 views must agree.</text>
    <text x="626" y="462">Different sides reveal ground</text>
    <text x="626" y="486">hidden behind buildings.</text>
    <text x="626" y="524" fill="#626262">The margin feeds the map edge.</text>
  </g>
</svg>
