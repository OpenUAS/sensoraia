    <rect x="745" y="199" width="85" height="6" fill="#ffd500"/>
    <text x="792" y="131" text-anchor="middle" font-size="15">Free space above</text>
    <text x="792" y="314" text-anchor="middle" font-size="14" fill="white">Solid below</text>
    <g font-size="19" font-weight="700">
      <text x="166" y="369" text-anchor="middle">01 / Depth maps</text>
      <text x="480" y="369" text-anchor="middle">02 / Trusted points</text>
      <text x="792" y="369" text-anchor="middle">03 / Triangle surface</text>
