<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="title">World first. Tiles second.</title>
  <desc id="desc">The historical 1400 by 1100 pixel map spans shared 500 pixel render blocks. A highlighted block includes a 64 pixel halo. Two 700 by 1100 output tiles cut through the blocks. Changing a tile border does not change the rendered pixels.</desc>
  <defs><pattern id="blocks" width="180" height="180" patternUnits="userSpaceOnUse" x="60" y="113"><path d="M0 180V0H180" stroke="#626262" stroke-width="1.5" stroke-dasharray="6 5" fill="none"/></pattern></defs>
  <rect width="960" height="590" fill="#f5f5f5"/><rect width="960" height="80" fill="#090909"/><rect width="7" height="80" fill="#ffd500"/>
  <text x="28" y="36" fill="white" font-size="26" font-weight="700">World first. Tiles second.</text>
  <text x="28" y="63" fill="#bdbdbd" font-size="16">Shared render blocks / Independent output borders / Historical orthomap layout</text>
  <rect x="60" y="113" width="540" height="432" fill="white"/>
  <rect x="217" y="270" width="226" height="226" fill="#ffd500" fill-opacity=".22" stroke="#626262" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="240" y="293" width="180" height="180" fill="#ffd500"/>
  <rect x="60" y="113" width="540" height="432" fill="url(#blocks)"/>
  <rect x="60" y="113" width="252" height="396" fill="none" stroke="#171717" stroke-width="4"/>
  <rect x="312" y="113" width="252" height="396" fill="none" stroke="#171717" stroke-width="4"/>
  <g fill="#171717" font-size="18">
    <text x="186" y="187" text-anchor="middle" font-weight="700">TILE 1</text><text x="438" y="187" text-anchor="middle" font-weight="700">TILE 2</text>
    <text x="186" y="215" text-anchor="middle" font-size="16">700 × 1100 px</text><text x="438" y="215" text-anchor="middle" font-size="16">700 × 1100 px</text>
    <text x="374" y="364" text-anchor="middle" font-size="16" font-weight="700">500 px</text>
    <text x="374" y="390" text-anchor="middle" font-size="15">one block</text>
    <text x="186" y="569" text-anchor="middle" font-size="16" fill="#626262">Tile borders cross the world blocks.</text>
    <path d="M635 129H666" stroke="#626262" stroke-width="2" stroke-dasharray="6 5"/><text x="682" y="135" font-size="16">500 px render grid</text>
    <rect x="635" y="161" width="30" height="17" fill="#ffd500"/><text x="682" y="176" font-size="16">Block + 64 px halo</text>
    <path d="M635 215H666" stroke="#171717" stroke-width="4"/><text x="682" y="221" font-size="16">Final output borders</text>
    <rect x="627" y="267" width="305" height="265" fill="white"/>
    <rect x="627" y="267" width="305" height="5" fill="#ffd500"/>
    <text x="649" y="314" font-size="23" font-weight="700">Borders do not decide</text>
    <text x="649" y="342" font-size="23" font-weight="700">the pixel colour.</text>
    <text x="649" y="381" font-size="17">World position does.</text>
    <text x="649" y="416" font-size="16">Whole map versus four cut-outs:</text>
    <text x="649" y="447" font-size="17" font-weight="700">bit-identical colour,</text>
    <text x="649" y="472" font-size="17" font-weight="700">height and confidence.</text>
    <text x="649" y="506" font-size="15" fill="#626262">Halo gives context. Keep the centre.</text>
  </g>
</svg>
