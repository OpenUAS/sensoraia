<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">One roof. Two wrong positions.</title>
  <desc id="desc">Two cameras see the same roof corner from opposite sides. Extending their sight lines to a flat ground plane puts it at two different positions. A 3D surface is needed to recover the correct position. Schematic, not to scale.</desc>
  <rect width="960" height="540" fill="#f5f5f5"/>
  <rect width="960" height="80" fill="#090909"/><rect width="7" height="80" fill="#ffd500"/>
  <text x="28" y="37" fill="white" font-size="26" font-weight="700">One roof. Two wrong positions.</text>
  <text x="28" y="63" fill="#bdbdbd" font-size="16">Relief displacement / Side view / Schematic, not to scale</text>
  <g fill="#171717" font-size="18">
    <path d="M45 413H690" stroke="#171717" stroke-width="3"/>
    <rect x="45" y="416" width="645" height="16" fill="#dedede"/>
    <rect x="334" y="279" width="67" height="134" fill="#626262"/>
    <path d="M334 279H401" stroke="#171717" stroke-width="4"/>
    <text x="367" y="346" fill="white" text-anchor="middle" font-size="15">building</text>
    <rect x="143" y="143" width="36" height="22" rx="3"/><path d="M153 165H169L164 176H158Z"/>
    <rect x="544" y="143" width="36" height="22" rx="3"/><path d="M554 165H570L565 176H559Z"/>
    <text x="161" y="128" text-anchor="middle" font-weight="700">PHOTO A</text>
    <text x="562" y="128" text-anchor="middle" font-weight="700">PHOTO B</text>
    <path d="M161 176L368 279L637 413" fill="none" stroke="#171717" stroke-width="3"/>
    <path d="M562 176L368 279L116 413" fill="none" stroke="#626262" stroke-width="3" stroke-dasharray="8 7"/>
    <path d="M368 289V413" stroke="#ffd500" stroke-width="4"/>
    <circle cx="368" cy="279" r="8" fill="#ffd500" stroke="#171717" stroke-width="2"/>
    <text x="368" y="253" text-anchor="middle" font-size="17" font-weight="700">Same roof corner</text>
    <g stroke="#171717" stroke-width="3">
      <path d="M106 403L126 423M126 403L106 423M627 403L647 423M647 403L627 423"/>
    </g>
    <text x="116" y="455" text-anchor="middle" font-size="16">B places it here</text>
    <text x="637" y="455" text-anchor="middle" font-size="16">A places it here</text>
    <rect x="346" y="399" width="44" height="29" fill="#ffd500"/>
    <text x="368" y="455" text-anchor="middle" font-size="16" font-weight="700">Correct map position</text>
    <path d="M116 485H637M116 478V492M637 478V492" stroke="#626262" stroke-width="1.5"/>
    <rect x="226" y="474" width="300" height="24" fill="#f5f5f5"/>
    <text x="376" y="492" text-anchor="middle" font-size="16">Disagreement creates ghosts and seams</text>
    <rect x="716" y="119" width="218" height="294" fill="white"/>
    <rect x="716" y="119" width="218" height="5" fill="#ffd500"/>
    <text x="735" y="159" font-size="18" font-weight="700">Why height matters</text>
    <text x="735" y="195" font-size="17">shift ≈ r · h / (H − h)</text>
    <g font-size="15" fill="#626262">
      <text x="735" y="229">r / camera offset</text>
      <text x="735" y="256">h / object height</text>
      <text x="735" y="283">H / camera height</text>
    </g>
    <text x="735" y="327" font-size="29" font-weight="750">12 m</text>
    <text x="735" y="354" font-size="16">shift in the worked example</text>
    <text x="735" y="385" font-size="15" fill="#626262">120 m camera / 20 m roof</text>
    <text x="716" y="450" font-size="16">Blending cannot repair</text>
    <text x="716" y="475" font-size="16">a missing height model.</text>
  </g>
</svg>
