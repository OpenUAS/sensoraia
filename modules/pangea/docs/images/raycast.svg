<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="title">The right surface. The right photograph.</title>
  <desc id="desc">Vertical rays find the top surface for roof pixel P1 and ground pixel P2. C1 sees the roof but a wall blocks its view of P2. C2 sees P2, so its original colour is used. Solid lines are visible, dashed lines are blocked. Schematic, not to scale.</desc>
  <defs><marker id="down" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#171717"/></marker></defs>
  <rect width="960" height="570" fill="#f5f5f5"/><rect width="960" height="80" fill="#090909"/><rect width="7" height="80" fill="#ffd500"/>
  <text x="28" y="36" fill="white" font-size="26" font-weight="700">The right surface. The right photograph.</text>
  <text x="28" y="63" fill="#bdbdbd" font-size="16">Vertical intersection + camera visibility / Schematic, not to scale</text>
  <g font-size="17" fill="#171717">
    <path d="M34 117H607" stroke="#626262" stroke-width="2" stroke-dasharray="7 5"/>
    <rect x="296" y="110" width="16" height="14" fill="#ffd500" stroke="#171717"/>
    <rect x="365" y="110" width="16" height="14" fill="#ffd500" stroke="#171717"/>
    <text x="279" y="145" text-anchor="end" font-size="15">P2 / ground</text>
    <text x="392" y="145" font-size="15">P1 / roof</text>
    <rect x="96" y="177" width="32" height="20" rx="3"/><path d="M104 197H120L116 207H109Z"/>
    <rect x="529" y="177" width="32" height="20" rx="3"/><path d="M537 197H553L549 207H542Z"/>
    <text x="112" y="166" text-anchor="middle" font-weight="700">C2</text><text x="545" y="166" text-anchor="middle" font-weight="700">C1</text>
    <rect x="338" y="306" width="99" height="174" fill="#626262"/>
    <path d="M34 480H338V306H437V480H607" stroke="#171717" stroke-width="3" fill="none"/>
    <rect x="338" y="303" width="99" height="7" fill="#ffd500"/>
    <path d="M373 125V297M304 125V469" stroke="#171717" stroke-width="2.5" fill="none" marker-end="url(#down)"/>
    <path d="M373 306L545 207M304 480L112 207" stroke="#171717" stroke-width="3"/>
    <path d="M304 480L545 207" stroke="#626262" stroke-width="2" stroke-dasharray="7 6"/>
    <path d="M330 433L346 449M346 433L330 449" stroke="#171717" stroke-width="3"/>
    <circle cx="373" cy="306" r="7" fill="#ffd500" stroke="#171717" stroke-width="2"/>
    <circle cx="304" cy="480" r="7" fill="#ffd500" stroke="#171717" stroke-width="2"/>
    <text x="388" y="359" text-anchor="middle" fill="white" font-size="15">First hit</text>
    <text x="388" y="384" text-anchor="middle" fill="white" font-size="15">is the roof</text>
    <rect x="634" y="110" width="298" height="166" fill="white"/><rect x="634" y="110" width="5" height="166" fill="#ffd500"/>
    <text x="656" y="151" font-size="22" font-weight="700">P1 / Roof pixel</text>
    <text x="656" y="186">C1 sees the roof.</text>
    <text x="656" y="218">Use its original photo colour.</text>
    <text x="656" y="249" fill="#626262" font-size="15">Store the roof height.</text>
    <rect x="634" y="303" width="298" height="181" fill="white"/>
    <text x="656" y="343" font-size="22" font-weight="700">P2 / Ground pixel</text>
    <text x="656" y="378">The wall blocks C1. Skip it.</text>
    <text x="656" y="410">C2 sees the ground.</text>
    <text x="656" y="442">Use C2, not the wall colour.</text>
    <text x="656" y="472" fill="#626262" font-size="15">Solid / visible. Dashed / blocked.</text>
    <path d="M28 518H932" stroke="#dedede"/>
    <text x="28" y="546" font-size="17">Finding a height is not enough: the source photograph must really see that surface point.</text>
  </g>
</svg>
