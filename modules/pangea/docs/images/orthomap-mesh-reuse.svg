<svg xmlns="http://www.w3.org/2000/svg" width="980" height="450" viewBox="0 0 980 450" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="title">One model. Newly rendered imagery.</title>
  <desc id="desc">The first build reconstructs geometry before rendering. A later export loads that mesh and its coordinate reference, skips reconstruction, and still uses original photographs to render new tiles.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#171717" stroke-width="2"/></marker></defs>
  <rect width="980" height="450" fill="#f5f5f5"/>
  <rect width="980" height="78" fill="#090909"/>
  <rect width="7" height="78" fill="#ffd500"/>
  <text x="28" y="36" font-size="25" font-weight="700" fill="white">One model. Newly rendered imagery.</text>
  <text x="28" y="61" font-size="16" fill="#bdbdbd">Saved mesh does not mean saved tiles.</text>
  <g font-size="17" fill="#171717">
    <text x="28" y="143" font-size="14" font-weight="700">FIRST BUILD</text>
    <rect x="173" y="104" width="196" height="86" fill="white" stroke="#dedede"/>
    <text x="271" y="140" text-anchor="middle" font-weight="700">Original photos</text>
    <text x="271" y="166" text-anchor="middle" font-size="15" fill="#626262">Known camera data</text>
    <path d="M383 147H414" stroke="#171717" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="433" y="104" width="223" height="86" fill="#ffd500"/>
    <text x="544" y="140" text-anchor="middle" font-weight="700">Reconstruct the mesh</text>
    <text x="544" y="166" text-anchor="middle" font-size="15">Build the 3D surface</text>
    <path d="M670 147H699" stroke="#171717" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="719" y="104" width="233" height="86" fill="#171717"/>
    <text x="835" y="140" text-anchor="middle" font-weight="700" fill="white">Render new tiles</text>
    <text x="835" y="166" text-anchor="middle" font-size="15" fill="#bdbdbd">Original colour + geometry</text>
    <path d="M544 190V234" stroke="#626262" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="558" y="218" font-size="14" fill="#626262">Save mesh + reference</text>
    <text x="28" y="286" font-size="14" font-weight="700">LATER EXPORT</text>
    <rect x="173" y="245" width="483" height="86" fill="white" stroke="#dedede"/>
    <rect x="173" y="245" width="5" height="86" fill="#ffd500"/>
    <text x="414" y="281" text-anchor="middle" font-weight="700">Original photos + load the saved model</text>
    <text x="414" y="307" text-anchor="middle" font-size="15" fill="#626262">Matching coordinate reference / No reconstruction</text>
    <path d="M670 288H699" stroke="#171717" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="719" y="245" width="233" height="86" fill="#171717"/>
    <text x="835" y="281" text-anchor="middle" font-weight="700" fill="white">Render new tiles</text>
    <text x="835" y="307" text-anchor="middle" font-size="15" fill="#bdbdbd">Not copied from an old map</text>
    <path d="M28 369H952" stroke="#dedede"/>
    <text x="28" y="398" font-size="18" font-weight="700">134.2 s / Full-area XYZ / Saved mesh</text>
    <text x="28" y="428" font-size="16" fill="#626262">That benchmark excludes reconstruction. Rebuild when the area or scene no longer matches.</text>
  </g>
</svg>
