# Sensoraia camera selection for MORA deployment and standalone local runs.
#
# Edit CAMERA below (or pass CAMERA=<name> on the make command line) to choose
# which camera USHER activates by default:
#
#   spottercam  - Raspberry Pi AI Camera (IMX500) with vehicle detection (default)
#   aicam       - Raspberry Pi AI Camera (IMX500) plain photo capture (no AI)
#   lwircam     - Tiny1-C / TDK thermal camera (V4L2 + USBFS)
#   chdk        - Canon compact camera with CHDK firmware over USB PTP
#   earcam      - Acoustic array sound-source localization
#   loomcam     - Raspberry Pi AI Camera visual-return framework
#   diplacam    - Experimental neural 8-waypoint planner (no optical camera)
#
# Examples without editing this file:
#   make mora-deploy CAMERA=lwircam
#   bash examples/paparazzi/run_local_demo.sh --camera lwircam
#
# In Paparazzi Center simulations, selecting a camera session in the GUI
# automatically selects the matching camera for that flight.

CAMERA = spottercam
