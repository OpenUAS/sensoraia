# Application settings: read once when Diplacam starts; restart to apply edits.
# Flat key=value only. Put comments on separate lines; do not repeat keys.
# Model, descriptor, metadata and runtime paths are relative to this INI.
inference_backend=onnx
model=models/new_1200_fp32.onnx
model_descriptor=models/new_1200_fp32.ini
metadata=new_1200_deploy.json
onnx_lib_path=../../bin

# CPU inference threads (1..32). The deadline covers all 20 denoising passes,
# not each pass separately. This supplied profile uses 4000 ms; omission uses
# the shared application default of 2000 ms. Cancellation is cooperative.
onnx_threads=1
inference_timeout_ms=4000

# Independent reproducible streams, unsigned 64-bit seeds (including zero).
# Diffusion advances for each sampled plan and survives worker survey resets.
# Sensor noise advances for admitted observations; STOP then START resets it.
diffusion_seed=123
sensor_noise_seed=149

# Horizontal inset in 2 m grid cells (0..24). Two cells publish XY in 4..96 m.
# Applies to both planners; comparison search also respects this inset.
# This does not change the fixed 2 m demo height or the model's XYZ contract.
flight_margin_cells=2

# GP prior: scalar mean in field units, variance in squared field units,
# and spatial correlation length in metres. Variance and length must be > 0.
# The prior mean is finite and independent of the comparison utility threshold.
gp_prior_mean=0.2
gp_kernel_variance=0.0079
gp_lengthscale_m=4.78

# Synthetic sensor: full FOV angle in degrees (strictly 0..180), and positive
# noise VARIANCE, not standard deviation. The same variance drives injected
# Gaussian noise and the GP likelihood. These are experiment settings, not
# camera calibration. Changing them or the GP prior changes model inputs;
# the supplied values preserve the reference profile, not a retrained model.
sensor_fov_deg=60
sensor_noise_variance=0.01

# Explicit classical comparison selection; never a fallback after ONNX failure.
cmaes=false

# Comparison-only cooperative budget (1..4000 ms), evaluation limit (12..3000)
# and positive seed (1..2147483647). A full population has 12 candidates.
# A cancelled or incomplete search does not publish a partial route.
cmaes_budget_ms=1000
cmaes_maxfevals=300
cmaes_seed=55

# Comparison importance threshold in field units, nonnegative confidence
# multiplier, and positive initial XY optimizer standard deviation in metres.
# These do not alter diffusion sampling or the GP prior mean.
cmaes_utility_threshold=0.3
cmaes_confidence_beta=1
cmaes_step_xy_m=20
