<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 485" width="1120" height="485" role="img" aria-labelledby="title desc">
  <title id="title">The difference is where a roof is placed</title>
  <desc id="desc">A comparison of roof placement, image seams and surface geometry.</desc>
  <rect width="1120" height="485" rx="24" fill="#f4f5ef"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#173730">
    <text x="34" y="42" font-size="21" font-weight="700">BETTER JOINS AND BETTER GEOMETRY ARE DIFFERENT THINGS</text>
    <text x="34" y="75" font-size="15" fill="#53665e">Side view. The coloured roof patch is the part we want to place.</text>
    <g>
      <rect x="28" y="100" width="344" height="313" rx="16" fill="#fff" stroke="#d2dccf"/>
      <text x="48" y="133" font-size="12" font-weight="700" letter-spacing="2" fill="#58759d">01 / SIMPLE</text>
      <text x="48" y="163" font-size="21" font-weight="700">Project onto a plane</text>
      <path d="M65 325H342" stroke="#a5b1a7" stroke-width="3"/>
      <rect x="106" y="267" width="69" height="58" fill="#d4ddd0"/>
      <path d="M102 266H179" stroke="#173730" stroke-width="6"/>
      <rect x="130" y="209" width="24" height="15" rx="3" fill="#58759d"/>
      <path d="M142 224L166 266L200 325" fill="none" stroke="#58759d" stroke-width="2.5"/>
      <path d="M166 269V322" stroke="#a5b1a7" stroke-dasharray="4 4" stroke-width="2"/>
      <path d="M189 325H211" stroke="#bb7749" stroke-width="8"/>
      <text x="236" y="314" text-anchor="middle" font-size="12" fill="#99603b">shifted roof</text>
      <path d="M236 318L205 327" fill="none" stroke="#99603b"/>
      <text x="48" y="365" font-size="15">Fast placement. Height is ignored.</text>
      <text x="48" y="389" font-size="14" fill="#53665e">Raised features can be displaced.</text>
    </g>
    <g>
      <rect x="388" y="100" width="344" height="313" rx="16" fill="#fff" stroke="#d2dccf"/>
      <text x="408" y="133" font-size="12" font-weight="700" letter-spacing="2" fill="#99753c">02 / MEDIUM</text>
      <text x="408" y="163" font-size="21" font-weight="700">Improve photo joins</text>
      <path d="M425 325H702" stroke="#a5b1a7" stroke-width="3"/>
      <rect x="466" y="267" width="69" height="58" fill="#d4ddd0"/>
      <path d="M462 266H539" stroke="#173730" stroke-width="6"/>
      <rect x="490" y="209" width="24" height="15" rx="3" fill="#99753c"/>
      <path d="M502 224L526 266L560 325" fill="none" stroke="#99753c" stroke-width="2.5"/>
      <path d="M526 269V322" stroke="#a5b1a7" stroke-dasharray="4 4" stroke-width="2"/>
      <path d="M544 325H576" stroke="#bb7749" stroke-width="8" stroke-opacity=".55"/>
      <text x="616" y="314" text-anchor="middle" font-size="12" fill="#99603b">still shifted</text>
      <path d="M610 318L570 327" fill="none" stroke="#99603b"/>
      <text x="408" y="365" font-size="15">Smoother joins. Still a flat plane.</text>
      <text x="408" y="389" font-size="14" fill="#53665e">Blending is not height correction.</text>
    </g>
    <g>
      <rect x="748" y="100" width="344" height="313" rx="16" fill="#e2e8dc" stroke="#c1ceb9"/>
      <text x="768" y="133" font-size="12" font-weight="700" letter-spacing="2" fill="#43756c">03 / ADVANCED</text>
      <text x="768" y="163" font-size="21" font-weight="700">Use the 3D surface</text>
      <path d="M785 325H1062" stroke="#a5b1a7" stroke-width="3"/>
      <rect x="826" y="267" width="69" height="58" fill="#c0ceba"/>
      <path d="M826 281L842 267L858 286L874 267L892 280M826 300L858 286L875 311L895 292M826 322L850 312L858 286M850 312L875 311L894 325" fill="none" stroke="#91a78c" stroke-width="1.5"/>
      <path d="M822 266H899" stroke="#173730" stroke-width="6"/>
      <rect x="850" y="209" width="24" height="15" rx="3" fill="#43756c"/>
      <path d="M862 224L886 266" fill="none" stroke="#43756c" stroke-width="2.5"/>
      <path d="M886 269V322" stroke="#43756c" stroke-dasharray="4 4" stroke-width="2"/>
      <path d="M875 266H897" stroke="#bb7749" stroke-width="8"/>
      <path d="M875 325H897" stroke="#43756c" stroke-width="5"/>
      <text x="976" y="314" text-anchor="middle" font-size="12" fill="#43756c">roof footprint</text>
      <path d="M956 318L899 327" fill="none" stroke="#43756c"/>
      <text x="768" y="365" font-size="15">Model height + camera visibility.</text>
      <text x="768" y="389" font-size="14" fill="#53665e">Correction depends on mesh quality.</text>
    </g>
    <text x="34" y="454" font-size="14" fill="#53665e">All three can export orthomap or XYZ. None can create detail that was not captured.</text>
  </g>
</svg>
