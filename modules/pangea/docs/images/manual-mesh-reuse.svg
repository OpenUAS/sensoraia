<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 410" width="1120" height="410" role="img" aria-labelledby="title desc">
  <title id="title">Build once, render again</title>
  <desc id="desc">A first Advanced run reconstructs a three-dimensional mesh and then renders a map. Reuse loads the saved mesh, skips reconstruction and still renders new tiles from the original photos. Saved-mesh timing excludes reconstruction.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10" fill="none" stroke="#63756b" stroke-width="1.6"/></marker></defs>
  <rect width="1120" height="410" rx="24" fill="#f4f5ef"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#173730">
    <text x="34" y="42" font-size="22" font-weight="700">SAVED MESH DOES NOT MEAN SAVED TILES</text>
    <text x="34" y="75" font-size="16" fill="#53665e">Same capture. Same valid 3D model. Newly rendered output.</text>
    <text x="34" y="128" font-size="15" font-weight="700">FIRST BUILD</text>
    <rect x="206" y="102" width="193" height="83" rx="12" fill="#fff" stroke="#d2dccf"/>
    <text x="302" y="137" text-anchor="middle" font-size="17" font-weight="600">Original photos</text>
    <text x="302" y="164" text-anchor="middle" font-size="14" fill="#53665e">With camera data</text>
    <path d="M410 143H448" stroke="#63756b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="463" y="102" width="234" height="83" rx="12" fill="#fff0d8" stroke="#d9b87b"/>
    <text x="580" y="137" text-anchor="middle" font-size="17" font-weight="600">Reconstruct 3D mesh</text>
    <text x="580" y="164" text-anchor="middle" font-size="14" fill="#84612a">Expensive geometry stage</text>
    <path d="M708 143H747" stroke="#63756b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="762" y="102" width="319" height="83" rx="12" fill="#173730"/>
    <text x="921" y="137" text-anchor="middle" font-size="17" font-weight="600" fill="#fff">Render + publish new tiles</text>
    <text x="921" y="164" text-anchor="middle" font-size="14" fill="#c5dec8">Original photo colour + mesh</text>
    <path d="M580 185V224" stroke="#63756b" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <text x="34" y="276" font-size="15" font-weight="700">LATER EXPORT</text>
    <rect x="206" y="238" width="491" height="83" rx="12" fill="#e2e8dc" stroke="#c1ceb9"/>
    <text x="451" y="273" text-anchor="middle" font-size="17" font-weight="600">Original photos + load saved mesh</text>
    <text x="451" y="300" text-anchor="middle" font-size="14" fill="#53665e">No new reconstruction</text>
    <path d="M708 280H747" stroke="#63756b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="762" y="238" width="319" height="83" rx="12" fill="#173730"/>
    <text x="921" y="273" text-anchor="middle" font-size="17" font-weight="600" fill="#fff">Render + publish new tiles</text>
    <text x="921" y="300" text-anchor="middle" font-size="14" fill="#c5dec8">Not copied from an old map</text>
    <text x="34" y="370" font-size="16" font-weight="600">The 134.2 s full-area XYZ benchmark follows the later-export path.</text>
    <text x="34" y="396" font-size="14" fill="#53665e">It excludes reconstruction. Rebuild when the area or scenery no longer matches the model.</text>
  </g>
</svg>
