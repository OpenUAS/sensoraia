inference_backend=auto
input_source=live
# On MORA with the IMX500 AI Camera, nn_vehicles.rpk runs on the sensor.
# In PC simulation and saved-image CPU analysis, Spottercam probes sibling ONNX
# exports (vehicle_yolo11n_int8.onnx, then vehicle_yolo11n_fp32.onnx) in models/
# and uses the working ONNX detector with its matching .ini descriptor.
model=models/nn_vehicles.rpk
score_threshold=0.6
class_index=0
max_detections=5
onnx_threads=1
inference_timeout_ms=2000
