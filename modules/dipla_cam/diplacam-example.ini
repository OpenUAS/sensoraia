# Worker settings: read once at process startup, separately from model settings.
# Flat key=value; comments need their own line. Restart USHER's worker to reload.
# The field path is relative to the worker's working directory, not this INI.
# It must contain the complete fixed 51x51, 2 m lattice with x,y,count columns.
field=share/diplacam/field.csv

# No geographic origin setting: the first valid admitted shot after a new
# survey START becomes local (50,50), the field centre. Chunk STARTs retain
# that anchor; STOP ends the survey. Paparazzi chooses the survey entry point.

# Minimum cooldown after a planning attempt finishes (100..5000 ms), not a shot
# interval or a fixed-rate timer. Fresh input and a requested chunk are needed
# to start another plan; the mission decides when to request that chunk.
cadence_ms=1000

# Maximum age of an admitted pose when a NEW plan starts (1..5000 ms).
# This is distinct from the fixed 5000 ms observation/reply lease. A delayed
# accepted measurement can still update the GP but cannot start a plan after
# this age. Supply fresh observations while waiting; do not relax transport
# freshness to compensate for missing input.
planning_pose_max_age_ms=1000